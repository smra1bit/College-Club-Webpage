<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Club Hub - Home</title>
    <!-- Links the external CSS stylesheet to apply layout, colors, and typography -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Section: Uses Flexbox to align the college brand on the left and navigation links on the right -->
    <header>
        <div class="logo-box">
            <img src="logo.jpeg" alt="College Logo" class="logo">
            <div>
                <p class="college-name">SITARE UNIVERSITY</p>
                <h2 class="hub-title">COLLEGE CLUB HUB</h2>
            </div>
        </div>

        <!-- Navigation Bar: Provides links to switch between different pages -->
        <nav>
            <a href="#home">Home</a>
            <a href="#clubs">Clubs</a>
            <a href="#about">About</a>
            </nav>
        </section>
    <img id="group-image" src="group_photo.jpeg" alt="itc_project">
</body>
</html>
